# --- Supply-chain SBOM / scan tooling (Req 19.6) ----------------------------
# These are NOT pip packages: Syft and Grype are standalone Go binaries from
# Anchore, installed in CI / on the build host from the official release
# (e.g. `curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh \
#        | sh -s -- -b /usr/local/bin v1.18.1`). We record the *required* pinned
# version here so the version is a single source of truth, tracked and reviewed
# like every other dependency. scripts/build-images.sh reads SYFT_VERSION /
# GRYPE_VERSION from the environment (falling back to these pins) and, in CI,
# fails if the installed binary version does not match.
[tool.sbom]
syft = "1.18.1"    # task 39.1 — per-image CycloneDX + SPDX SBOM generation
grype = "0.87.0"   # task 39.2 — OSV vulnerability scan of each SBOM
skopeo = "1.16.1"  # task 39.3 — embed SBOM digest as an OCI annotation
oras = "1.2.0"     # task 39.4 — push each CycloneDX SBOM as an OCI artifact
