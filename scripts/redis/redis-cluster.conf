# =============================================================================
# EI-ADS Redis Cluster Configuration
# =============================================================================
# Topology: 3 primary + 2 replica nodes (Req 23.5).
#
#   - The 3 primary nodes collectively own the 16384 hash slots (consistent
#     hashing). Each primary owns a contiguous slot range.
#   - The 2 replica nodes provide failover: on primary loss, a replica is
#     promoted so slot ownership is preserved and the cache stays available.
#   - Because there are 5 nodes but only 3 primaries, 2 of the 3 primaries are
#     replicated and 1 is not; production SHOULD prefer a 3-primary + 3-replica
#     (6 node) layout for full redundancy. The 3+2 layout satisfies Req 23.5
#     for the reference deployment.
#
# In production this file is mounted into each pod of the `redis-cluster`
# StatefulSet (see k8s task 36.2). Every node uses this same base config; the
# StatefulSet ordinal + headless Service DNS gives each node its identity, and
# the cluster is bootstrapped once with `redis-cli --cluster create` (see
# README.md in this directory).
# =============================================================================

# -----------------------------------------------------------------------------
# Cluster mode
# -----------------------------------------------------------------------------
# Enable Redis Cluster mode. Every node in the StatefulSet runs with this on.
cluster-enabled yes

# Per-node cluster bookkeeping file. Managed by Redis, NOT hand-edited. On the
# StatefulSet each pod writes this to its own persistent volume.
cluster-config-file nodes.conf

# How long (ms) a node can be unreachable before it is considered failing.
# 5000 ms balances fast failover against false positives on transient blips.
cluster-node-timeout 5000

# Allow the cluster to keep serving the slots that are still available even if
# some slots are uncovered (a primary AND its replica are both down). Set to
# "yes" so a partial outage does not take down the whole cache.
cluster-require-full-coverage no

# -----------------------------------------------------------------------------
# Persistence — AOF (append-only file)
# -----------------------------------------------------------------------------
# AOF gives durability for the pairing store and other short-TTL keys across
# pod restarts. everysec fsync is the standard durability/performance tradeoff.
appendonly yes
appendfsync everysec

# Rewrite the AOF when it grows too large relative to the last rewrite.
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# -----------------------------------------------------------------------------
# Persistence — RDB snapshots
# -----------------------------------------------------------------------------
# Snapshot rules: save if (seconds, changes) threshold is met.
#   after 900s  if >=    1 key changed
#   after 300s  if >=   10 keys changed
#   after  60s  if >= 10000 keys changed
save 900 1
save 300 10
save 60 10000

# Directory where the RDB + AOF files live. Backed by the StatefulSet PVC.
dir /data

# -----------------------------------------------------------------------------
# Memory management
# -----------------------------------------------------------------------------
# All EI-ADS cache keys carry a TTL; allkeys-lru evicts the least-recently-used
# keys under memory pressure so hot entries (target >= 90% hit rate, Req 17.4)
# stay resident.
maxmemory-policy allkeys-lru

# Per-node memory ceiling. TUNE PER ENVIRONMENT: 2gb is a reference default for
# a mid-size cluster; size this to the node's container memory limit minus
# headroom for replication buffers and the OS.
maxmemory 2gb

# -----------------------------------------------------------------------------
# Networking / liveness
# -----------------------------------------------------------------------------
# TCP keepalive (seconds) to detect dead peers and keep NAT/LB mappings warm.
tcp-keepalive 300

# Standard Redis port; the cluster bus port is this + 10000 (16379) and must
# also be open between nodes.
port 6379

# -----------------------------------------------------------------------------
# Authentication
# -----------------------------------------------------------------------------
# SECURITY: NEVER commit real passwords. These are placeholders. In production
# set them via a Kubernetes Secret mounted as an env var / rendered config, or
# use `CONFIG SET` at bootstrap. `requirepass` protects client access;
# `masterauth` lets a replica authenticate to its primary during replication.
#
#   requirepass ${REDIS_PASSWORD}
#   masterauth  ${REDIS_PASSWORD}
#
# The two MUST match across all nodes so replicas can sync from primaries.
requirepass CHANGE_ME_SET_VIA_ENV_OR_SECRET
masterauth CHANGE_ME_SET_VIA_ENV_OR_SECRET

# Protected mode is redundant once requirepass is set, but kept on as defence
# in depth for any interface without an explicit bind.
protected-mode yes
