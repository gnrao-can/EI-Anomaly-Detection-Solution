# =============================================================================
# EI-ADS Neo4j Graph Service — StatefulSet + headless Service + PDB
# =============================================================================
# The Graph_Service maintains the claimant-employer graph in Neo4j and exposes
# community detection / link analysis for the Fraud_Ring_Engine (design:
# "Graph Service (Neo4j + PyG GNN)").
#
# Topology: 3-node causal cluster (task 36.2). A 3-member core gives Raft
# quorum (tolerates the loss of 1 core member) which supports the 99.5% uptime
# and single-point-of-failure goals of Requirement 23.
#
# NOTE (sandbox): these manifests are validated for YAML well-formedness only.
# They have NOT been applied to a live cluster (no cluster available in the
# sandbox). Neo4j clustering (causal cluster) requires Neo4j Enterprise; the
# image tag below is a placeholder to be pinned to the licensed Enterprise
# image at deploy time.
# -----------------------------------------------------------------------------
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: neo4j-cluster
  namespace: ei-ads
  labels:
    app.kubernetes.io/name: neo4j-cluster
    app.kubernetes.io/part-of: ei-ads
    app.kubernetes.io/component: graph-store
spec:
  serviceName: neo4j-cluster-headless
  replicas: 3
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app.kubernetes.io/name: neo4j-cluster
  template:
    metadata:
      labels:
        app.kubernetes.io/name: neo4j-cluster
        app.kubernetes.io/part-of: ei-ads
        app.kubernetes.io/component: graph-store
    spec:
      # Spread the 3 core members across distinct nodes for HA.
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/name: neo4j-cluster
              topologyKey: kubernetes.io/hostname
      securityContext:
        runAsNonRoot: true
        runAsUser: 7474
        fsGroup: 7474
      terminationGracePeriodSeconds: 120
      containers:
        - name: neo4j
          # Pin to the licensed Neo4j Enterprise image at deploy time.
          image: neo4j:5.20-enterprise
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 7474
            - name: bolt
              containerPort: 7687
            - name: discovery
              containerPort: 5000
            - name: raft
              containerPort: 7000
            - name: transaction
              containerPort: 6000
          env:
            - name: NEO4J_ACCEPT_LICENSE_AGREEMENT
              value: "yes"
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: NEO4J_server_default__advertised__address
              value: "$(POD_NAME).neo4j-cluster-headless.ei-ads.svc.cluster.local"
            - name: NEO4J_dbms_mode
              value: "CORE"
            - name: NEO4J_causal__clustering_minimum__core__cluster__size__at__formation
              value: "3"
            - name: NEO4J_causal__clustering_initial__discovery__members
              value: "neo4j-cluster-0.neo4j-cluster-headless.ei-ads.svc.cluster.local:5000,neo4j-cluster-1.neo4j-cluster-headless.ei-ads.svc.cluster.local:5000,neo4j-cluster-2.neo4j-cluster-headless.ei-ads.svc.cluster.local:5000"
            - name: NEO4J_AUTH
              valueFrom:
                secretKeyRef:
                  name: neo4j-auth
                  key: NEO4J_AUTH
          resources:
            requests:
              cpu: "1"
              memory: 4Gi
            limits:
              cpu: "2"
              memory: 8Gi
          # Bolt is the client protocol; liveness confirms the process is up.
          livenessProbe:
            tcpSocket:
              port: bolt
            initialDelaySeconds: 60
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 6
          # Readiness gates traffic on the HTTP management endpoint.
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          volumeMounts:
            - name: data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 50Gi
---
# Headless Service — provides stable per-pod DNS for cluster discovery.
apiVersion: v1
kind: Service
metadata:
  name: neo4j-cluster-headless
  namespace: ei-ads
  labels:
    app.kubernetes.io/name: neo4j-cluster
    app.kubernetes.io/part-of: ei-ads
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: neo4j-cluster
  ports:
    - name: http
      port: 7474
      targetPort: http
    - name: bolt
      port: 7687
      targetPort: bolt
    - name: discovery
      port: 5000
      targetPort: discovery
    - name: raft
      port: 7000
      targetPort: raft
    - name: transaction
      port: 6000
      targetPort: transaction
---
# Client-facing Service — load-balances Bolt/HTTP across ready core members.
apiVersion: v1
kind: Service
metadata:
  name: neo4j-cluster
  namespace: ei-ads
  labels:
    app.kubernetes.io/name: neo4j-cluster
    app.kubernetes.io/part-of: ei-ads
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: neo4j-cluster
  ports:
    - name: http
      port: 7474
      targetPort: http
    - name: bolt
      port: 7687
      targetPort: bolt
---
# PodDisruptionBudget — keep Raft quorum (2 of 3) during voluntary disruptions.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: neo4j-cluster
  namespace: ei-ads
  labels:
    app.kubernetes.io/name: neo4j-cluster
    app.kubernetes.io/part-of: ei-ads
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: neo4j-cluster
