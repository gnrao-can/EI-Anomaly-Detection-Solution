# ============================================================
# EI-ADS OpenTelemetry Collector — Kubernetes manifests (task 32.1 / Req 21.5)
#
# Deploys the OTLP collector that receives distributed-tracing spans from every
# EI-ADS microservice. Services export to http://otel-collector:4317 via
# OTEL_EXPORTER_OTLP_ENDPOINT (see shared/telemetry.py). The ConfigMap mirrors
# scripts/otel/otel-collector-config.yaml used by local podman-compose.
# ============================================================
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
  namespace: ei-ads
  labels:
    app.kubernetes.io/name: otel-collector
    app.kubernetes.io/part-of: ei-ads
data:
  otel-collector-config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318

    processors:
      memory_limiter:
        check_interval: 5s
        limit_mib: 512
        spike_limit_mib: 128
      batch:
        timeout: 5s
        send_batch_size: 512

    extensions:
      health_check:
        endpoint: 0.0.0.0:13133

    exporters:
      debug:
        verbosity: normal

    service:
      extensions: [health_check]
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [debug]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
  namespace: ei-ads
  labels:
    app.kubernetes.io/name: otel-collector
    app.kubernetes.io/part-of: ei-ads
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: otel-collector
  template:
    metadata:
      labels:
        app.kubernetes.io/name: otel-collector
        app.kubernetes.io/part-of: ei-ads
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: otel-collector
          image: otel/opentelemetry-collector-contrib:0.116.1
          args: ["--config=/etc/otel-collector/otel-collector-config.yaml"]
          ports:
            - name: otlp-grpc
              containerPort: 4317
            - name: otlp-http
              containerPort: 4318
            - name: health
              containerPort: 13133
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /
              port: 13133
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /
              port: 13133
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: config
              mountPath: /etc/otel-collector
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: otel-collector-config
---
apiVersion: v1
kind: Service
metadata:
  name: otel-collector
  namespace: ei-ads
  labels:
    app.kubernetes.io/name: otel-collector
    app.kubernetes.io/part-of: ei-ads
spec:
  selector:
    app.kubernetes.io/name: otel-collector
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
    - name: otlp-http
      port: 4318
      targetPort: 4318
