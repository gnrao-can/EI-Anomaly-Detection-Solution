---
# claimant-portal — Ingress with TLS 1.3 termination and GCKey OAuth 2.0 routing.
# Requirements: 19.1 (Protected B; encryption in transit), 1.1 / 19.7 (GCKey
#   OAuth 2.0 authentication).
# Design: GCKey OAuth 2.0 Flow (302 redirect to GCKey /authorize; authorization
#   code exchange; session cookie HttpOnly/Secure/SameSite=Strict) and Protected
#   B Data Classification: "TLS 1.3 mandatory on all ... external communications".
#
# TLS 1.3 termination:
#   - The Ingress terminates TLS for host portal.ei-ads.gc.ca using the
#     `claimant-portal-tls` Secret (server cert + key; provisioned by task 36.3).
#   - ssl-protocols / ssl-min-version annotations pin the negotiated protocol to
#     TLSv1.3 only. Both the ingress-nginx form and a generic min-version
#     annotation are provided so whichever controller is deployed enforces 1.3.
#   - HSTS + permanent HTTPS redirect force all traffic onto TLS.
#
# GCKey OAuth 2.0 redirect URIs (paths routed to the portal Service):
#   - /                        SPA entrypoint (portal probes / per 36.1).
#   - /submit                  unauthenticated -> portal issues 302 to GCKey
#                              /authorize (start of the OAuth code flow).
#   - /auth/gckey/callback     GCKey redirect_uri: authorization-code landing
#                              endpoint; portal exchanges code -> tokens.
#   - /auth/gckey/logout       post-logout redirect_uri.
#   - /api/v1/claims           authenticated claim submission (Bearer/session).
#   The full redirect_uri registered with the GCKey IdP is:
#     https://portal.ei-ads.gc.ca/auth/gckey/callback
#
# Routes to the claimant-portal Service on port 3000 (containerPort 3000 from the
# 36.1 Deployment; a Service named `claimant-portal` exposing port 3000 is
# assumed and provisioned alongside the Deployment).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: claimant-portal
  namespace: ei-ads-prod
  labels:
    app.kubernetes.io/name: claimant-portal
    app.kubernetes.io/part-of: ei-ads
    app.kubernetes.io/component: frontend
    ei-ads/tier: portal
  annotations:
    # --- TLS 1.3 termination (pin to TLSv1.3 only) ---
    nginx.ingress.kubernetes.io/ssl-protocols: "TLSv1.3"
    nginx.ingress.kubernetes.io/ssl-min-version: "TLSv1.3"
    # Generic / portable min-version hint for non-nginx controllers.
    ei-ads/tls-min-version: "TLSv1.3"
    # Force HTTPS + HSTS so no plaintext claimant PII transits.
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/hsts: "true"
    nginx.ingress.kubernetes.io/hsts-max-age: "31536000"
    nginx.ingress.kubernetes.io/hsts-include-subdomains: "true"
    # --- GCKey OAuth 2.0 ---
    # The authorization-code redirect_uri registered with the GCKey IdP.
    ei-ads/gckey-redirect-uri: "https://portal.ei-ads.gc.ca/auth/gckey/callback"
    ei-ads/gckey-post-logout-redirect-uri: "https://portal.ei-ads.gc.ca/auth/gckey/logout"
    # Preserve large auth headers (ID token / cookies) during the code exchange.
    nginx.ingress.kubernetes.io/proxy-buffer-size: "16k"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - portal.ei-ads.gc.ca
      secretName: claimant-portal-tls
  rules:
    - host: portal.ei-ads.gc.ca
      http:
        paths:
          # SPA entrypoint.
          - path: /
            pathType: Prefix
            backend:
              service:
                name: claimant-portal
                port:
                  number: 3000
          # Unauthenticated submit -> portal returns 302 to GCKey /authorize.
          - path: /submit
            pathType: Prefix
            backend:
              service:
                name: claimant-portal
                port:
                  number: 3000
          # GCKey OAuth 2.0 authorization-code callback (redirect_uri).
          - path: /auth/gckey/callback
            pathType: Prefix
            backend:
              service:
                name: claimant-portal
                port:
                  number: 3000
          # GCKey post-logout redirect.
          - path: /auth/gckey/logout
            pathType: Prefix
            backend:
              service:
                name: claimant-portal
                port:
                  number: 3000
          # Authenticated claim submission API (session/Bearer forwarded).
          - path: /api/v1/claims
            pathType: Prefix
            backend:
              service:
                name: claimant-portal
                port:
                  number: 3000
