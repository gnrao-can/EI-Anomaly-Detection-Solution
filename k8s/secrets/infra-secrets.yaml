# =============================================================================
# EI-ADS Infrastructure Secrets — TEMPLATES (Requirement 19.1)
# =============================================================================
# These Secrets back the stateful data stores created by the StatefulSets in
# k8s/statefulsets/ (task 36.2):
#   - neo4j-auth        -> neo4j-cluster.yaml   (NEO4J_AUTH)
#   - redis-auth        -> redis-cluster.yaml   (REDIS_PASSWORD)
#   - kafka-cluster-id  -> kafka-cluster.yaml   (KAFKA_KRAFT_CLUSTER_ID)
#
# SECURITY — READ BEFORE USE:
#   * This file is a TEMPLATE. Every value below is a clearly-marked
#     placeholder (REPLACE_ME / <PLACEHOLDER>). It contains NO real credentials
#     and MUST NOT be committed with real secret material.
#   * In every non-local environment the real values are injected at deploy
#     time via one of:
#       - Sealed Secrets  (bitnami/sealed-secrets — commit the SealedSecret,
#         the controller decrypts into the Secret at runtime), or
#       - External Secrets Operator (values sourced from GC KMS / Vault), or
#       - `oc create secret generic ...` / `kubectl create secret generic ...`
#         run out-of-band by the platform team.
#   * `stringData` is used so operators can paste plaintext when creating from
#     a template; Kubernetes base64-encodes it into `data` on apply.
#
# All Secrets live in the `ei-ads` namespace to match the StatefulSets and are
# `Opaque` type. RBAC (Requirement 19.1) restricts read access to the platform
# service accounts that mount them.
#
# NOTE (sandbox): validated for YAML well-formedness only (multi-doc safe).
# NOT applied to a live cluster (none available in the sandbox).
# -----------------------------------------------------------------------------
apiVersion: v1
kind: Secret
metadata:
  name: neo4j-auth
  namespace: ei-ads
  labels:
    app.kubernetes.io/name: neo4j-cluster
    app.kubernetes.io/part-of: ei-ads
    app.kubernetes.io/component: graph-store
type: Opaque
stringData:
  # Neo4j expects the combined "user/password" form for the NEO4J_AUTH env var.
  # REPLACE_ME at deploy time — e.g. "neo4j/<STRONG_GENERATED_PASSWORD>".
  NEO4J_AUTH: "neo4j/REPLACE_ME_STRONG_PASSWORD"
---
apiVersion: v1
kind: Secret
metadata:
  name: redis-auth
  namespace: ei-ads
  labels:
    app.kubernetes.io/name: redis-cluster
    app.kubernetes.io/part-of: ei-ads
    app.kubernetes.io/component: cache
type: Opaque
stringData:
  # Consumed by redis-cluster.yaml as REDIS_PASSWORD; the same value backs both
  # `requirepass` and `masterauth` in scripts/redis/redis-cluster.conf so
  # replicas can authenticate to their primaries.
  REDIS_PASSWORD: "REPLACE_ME_STRONG_PASSWORD"
---
apiVersion: v1
kind: Secret
metadata:
  name: kafka-cluster-id
  namespace: ei-ads
  labels:
    app.kubernetes.io/name: kafka-cluster
    app.kubernetes.io/part-of: ei-ads
    app.kubernetes.io/component: event-bus
type: Opaque
stringData:
  # KRaft cluster UUID consumed by kafka-cluster.yaml as KAFKA_KRAFT_CLUSTER_ID.
  # Generate ONCE per cluster with `kafka-storage.sh random-uuid` and keep it
  # stable for the life of the cluster (changing it orphans the log dirs).
  KAFKA_KRAFT_CLUSTER_ID: "REPLACE_ME_KRAFT_CLUSTER_UUID"
