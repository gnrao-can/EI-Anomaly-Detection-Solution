# =============================================================================
# EI-ADS External Data Source API Key Secrets — TEMPLATES (Requirement 19.1)
# =============================================================================
# API keys / usernames for the External_Data_Adapters (design: "External Data
# Adapters"). Key names mirror the env vars in .env.example so the adapter
# containers can consume them via `envFrom.secretRef` or `secretKeyRef`.
#
# SECURITY — READ BEFORE USE:
#   * TEMPLATE ONLY. Every value is a REPLACE_ME placeholder — NO real API keys
#     are present and none may be committed.
#   * Real values are injected at deploy time via Sealed Secrets / External
#     Secrets Operator (GC KMS / Vault) / `oc create secret generic`. See the
#     header of infra-secrets.yaml for the full policy.
#   * Data minimisation (Requirement 19.2) is enforced in adapter code, not
#     here; these Secrets only hold the credentials needed to authenticate to
#     each source.
#
# Namespace: ei-ads. Type: Opaque. Grouped by owning adapter.
#
# NOTE (sandbox): validated for YAML well-formedness only (multi-doc safe).
# NOT applied to a live cluster (none available in the sandbox).
# -----------------------------------------------------------------------------
# --- Provincial Business Registry Adapter -----------------------------------
# One API key per province/territory (13 jurisdictions) — see PROV_REG_API_KEY_*
# in .env.example. Corporations Canada (federal) key is included here too as it
# is used by the same Business Registry Adapter.
apiVersion: v1
kind: Secret
metadata:
  name: provincial-registry-api-keys
  namespace: ei-ads
  labels:
    app.kubernetes.io/part-of: ei-ads
    app.kubernetes.io/component: external-adapter
    ei-ads/data-source: provincial-registry
type: Opaque
stringData:
  PROV_REG_API_KEY_AB: "REPLACE_ME"
  PROV_REG_API_KEY_BC: "REPLACE_ME"
  PROV_REG_API_KEY_MB: "REPLACE_ME"
  PROV_REG_API_KEY_NB: "REPLACE_ME"
  PROV_REG_API_KEY_NL: "REPLACE_ME"
  PROV_REG_API_KEY_NS: "REPLACE_ME"
  PROV_REG_API_KEY_NT: "REPLACE_ME"
  PROV_REG_API_KEY_NU: "REPLACE_ME"
  PROV_REG_API_KEY_ON: "REPLACE_ME"
  PROV_REG_API_KEY_PE: "REPLACE_ME"
  PROV_REG_API_KEY_QC: "REPLACE_ME"
  PROV_REG_API_KEY_SK: "REPLACE_ME"
  PROV_REG_API_KEY_YT: "REPLACE_ME"
  # Federal Corporations Canada API key (Business Registry Adapter).
  CORPORATIONS_CANADA_API_KEY: "REPLACE_ME"
---
# --- GeoNames Adapter -------------------------------------------------------
# GeoNames authenticates with a username query param (no secret key), but the
# username is treated as a credential and injected via Secret.
apiVersion: v1
kind: Secret
metadata:
  name: geonames-api-credentials
  namespace: ei-ads
  labels:
    app.kubernetes.io/part-of: ei-ads
    app.kubernetes.io/component: external-adapter
    ei-ads/data-source: geonames
type: Opaque
stringData:
  GEONAMES_USERNAME: "REPLACE_ME"
---
