# =============================================================================
# EI-ADS GCKey OAuth 2.0 Secret — TEMPLATE (Requirements 19.1, 19.7)
# =============================================================================
# All EI-ADS API endpoints reject requests without a valid OAuth 2.0 Bearer
# token issued by GCKey (Requirement 19.7). The Claim Intake Service and API
# gateway validate tokens against the GCKey JWKS endpoint and exchange the
# authorization code using the confidential client credentials below. Keys
# mirror the GCKEY_* env vars in .env.example.
#
# The JWKS URL itself is not secret (it is a public well-known endpoint), but
# it is grouped here with the client credentials so the whole OAuth config is
# injected as one unit. If preferred, the URL can instead live in the
# ei-ads-app-config ConfigMap; it is kept here for a single OAuth config
# surface. GCKEY_CLIENT_SECRET is the sensitive value.
#
# SECURITY — READ BEFORE USE:
#   * TEMPLATE ONLY. GCKEY_CLIENT_SECRET is a REPLACE_ME placeholder.
#   * Real client credentials are provisioned by the GC Identity Provider and
#     injected at deploy time via Sealed Secrets / External Secrets Operator /
#     `oc create secret generic`. See infra-secrets.yaml header.
#
# Namespace: ei-ads. Type: Opaque.
#
# NOTE (sandbox): validated for YAML well-formedness only (multi-doc safe).
# NOT applied to a live cluster (none available in the sandbox).
# -----------------------------------------------------------------------------
apiVersion: v1
kind: Secret
metadata:
  name: gckey-oauth
  namespace: ei-ads
  labels:
    app.kubernetes.io/part-of: ei-ads
    app.kubernetes.io/component: auth
type: Opaque
stringData:
  # Public GCKey well-known JWKS endpoint used to verify Bearer token
  # signatures. Point at the GC Identity Provider endpoint in production.
  GCKEY_JWKS_URL: "https://auth.id.gc.ca/.well-known/jwks.json"
  # Confidential OAuth 2.0 client registration.
  GCKEY_CLIENT_ID: "REPLACE_ME_GCKEY_CLIENT_ID"
  GCKEY_CLIENT_SECRET: "REPLACE_ME_GCKEY_CLIENT_SECRET"
  # Redirect URI registered with GCKey for the Claimant Portal auth callback.
  GCKEY_REDIRECT_URI: "https://REPLACE_ME_PORTAL_HOST/auth/callback"
