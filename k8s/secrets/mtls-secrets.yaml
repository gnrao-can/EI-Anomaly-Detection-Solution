# =============================================================================
# EI-ADS mTLS Client Certificate Secrets — TEMPLATES (Requirement 19.1)
# =============================================================================
# The CRA and CBSA adapters connect over mutually-authenticated TLS (mTLS) on
# GC secure / Protected B channels (design: CRA Adapter, CBSA Adapter). Each
# adapter needs a client certificate, its private key, and the issuing CA
# bundle. These map to the CRA_CLIENT_CERT_PATH / CRA_CLIENT_KEY_PATH and
# CBSA_CLIENT_CERT_PATH / CBSA_CLIENT_KEY_PATH env vars in .env.example — in the
# cluster the Secret is mounted as files and the adapter points those env vars
# at the mount path.
#
# SECURITY — READ BEFORE USE:
#   * TEMPLATE ONLY. The PEM blocks below are placeholders, NOT real key
#     material. NEVER commit a real private key.
#   * Use type `kubernetes.io/tls` where a single cert+key pair is enough;
#     the CA bundle is carried in the same Secret under `ca.crt`.
#   * Real certs are issued by the GC PKI and injected at deploy time via
#     Sealed Secrets / External Secrets Operator / `oc create secret tls`.
#     Rotate before expiry; keep the private key off disk in git at all times.
#
# Namespace: ei-ads.
#
# NOTE (sandbox): validated for YAML well-formedness only (multi-doc safe).
# NOT applied to a live cluster (none available in the sandbox). The PEM
# placeholders are intentionally non-cryptographic marker text.
# -----------------------------------------------------------------------------
# --- CRA Adapter mTLS (GC secure data exchange) -----------------------------
apiVersion: v1
kind: Secret
metadata:
  name: cra-mtls-client-cert
  namespace: ei-ads
  labels:
    app.kubernetes.io/part-of: ei-ads
    app.kubernetes.io/component: external-adapter
    ei-ads/data-source: cra
type: kubernetes.io/tls
stringData:
  # tls.crt / tls.key are required by the kubernetes.io/tls type; ca.crt carries
  # the issuing CA bundle used to verify the CRA server certificate.
  tls.crt: |
    -----BEGIN CERTIFICATE-----
    REPLACE_ME_CRA_CLIENT_CERTIFICATE_PEM
    -----END CERTIFICATE-----
  tls.key: |
    -----BEGIN PRIVATE KEY-----
    REPLACE_ME_CRA_CLIENT_PRIVATE_KEY_PEM
    -----END PRIVATE KEY-----
  ca.crt: |
    -----BEGIN CERTIFICATE-----
    REPLACE_ME_CRA_ISSUING_CA_BUNDLE_PEM
    -----END CERTIFICATE-----
---
# --- CBSA Adapter mTLS (Protected B channel) --------------------------------
apiVersion: v1
kind: Secret
metadata:
  name: cbsa-mtls-client-cert
  namespace: ei-ads
  labels:
    app.kubernetes.io/part-of: ei-ads
    app.kubernetes.io/component: external-adapter
    ei-ads/data-source: cbsa
type: kubernetes.io/tls
stringData:
  tls.crt: |
    -----BEGIN CERTIFICATE-----
    REPLACE_ME_CBSA_CLIENT_CERTIFICATE_PEM
    -----END CERTIFICATE-----
  tls.key: |
    -----BEGIN PRIVATE KEY-----
    REPLACE_ME_CBSA_CLIENT_PRIVATE_KEY_PEM
    -----END PRIVATE KEY-----
  ca.crt: |
    -----BEGIN CERTIFICATE-----
    REPLACE_ME_CBSA_ISSUING_CA_BUNDLE_PEM
    -----END CERTIFICATE-----
