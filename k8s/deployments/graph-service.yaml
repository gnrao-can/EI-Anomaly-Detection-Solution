---
# graph-service — Deployment + HorizontalPodAutoscaler
# Requirements: 17.5 (horizontal pod autoscaling; hold latency under 3x load spikes)
# Design: Deployment Topology — graph-service (min: 2, max: 8 pods)
# Port 8006. Health probe: GET /healthz.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: graph-service
  namespace: ei-ads-prod
  labels:
    app.kubernetes.io/name: graph-service
    app.kubernetes.io/part-of: ei-ads
    app.kubernetes.io/component: graph
    ei-ads/tier: standard
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: graph-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: graph-service
        app.kubernetes.io/part-of: ei-ads
        app.kubernetes.io/component: graph
        ei-ads/tier: standard
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: graph-service
          image: registry.ei-ads.gc.ca/ei-ads/graph-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8006
              protocol: TCP
          resources:
            requests:
              cpu: "300m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8006
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8006
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: graph-service
  namespace: ei-ads-prod
  labels:
    app.kubernetes.io/name: graph-service
    app.kubernetes.io/part-of: ei-ads
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: graph-service
  minReplicas: 2
  maxReplicas: 8
  metrics:
    # Trigger 1: scale out when average CPU utilization exceeds 70%.
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    # Trigger 2: scale out when Kafka consumer lag exceeds 500 messages.
    # External metric `kafka_consumergroup_lag` is published to the Kubernetes external
    # metrics API by the Prometheus Adapter (prometheus-adapter), sourced from
    # kafka-exporter / Strimzi broker metrics. averageValue means 500
    # lagging messages per replica before scaling out.
    - type: External
      external:
        metric:
          name: kafka_consumergroup_lag
          selector:
            matchLabels:
              consumergroup: graph-service
        target:
          type: AverageValue
          averageValue: "500"
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - type: Percent
          value: 100
          periodSeconds: 30
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
