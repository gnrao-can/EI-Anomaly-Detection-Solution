---
# llm-service — Deployment + HorizontalPodAutoscaler
# Requirements: 17.5 (horizontal pod autoscaling; hold latency under 3x load spikes)
# Design: Deployment Topology — llm-service (min: 2, max: 8 pods) -- GPU node pool: NVIDIA A100
# Port 8005. Health probe: GET /healthz.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-service
  namespace: ei-ads-prod
  labels:
    app.kubernetes.io/name: llm-service
    app.kubernetes.io/part-of: ei-ads
    app.kubernetes.io/component: llm
    ei-ads/tier: gpu-a100
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: llm-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: llm-service
        app.kubernetes.io/part-of: ei-ads
        app.kubernetes.io/component: llm
        ei-ads/tier: gpu-a100
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      runtimeClassName: nvidia
      nodeSelector:
        cloud.google.com/gke-accelerator: nvidia-tesla-a100
        ei-ads/gpu-pool: nvidia-a100
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      containers:
        - name: llm-service
          image: registry.ei-ads.gc.ca/ei-ads/llm-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8005
              protocol: TCP
          resources:
            requests:
              cpu: "2"
              memory: "16Gi"
              nvidia.com/gpu: "1"
            limits:
              cpu: "8"
              memory: "32Gi"
              nvidia.com/gpu: "1"
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8005
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8005
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: llm-service
  namespace: ei-ads-prod
  labels:
    app.kubernetes.io/name: llm-service
    app.kubernetes.io/part-of: ei-ads
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: llm-service
  minReplicas: 2
  maxReplicas: 8
  metrics:
    # Trigger 1: scale out when average CPU utilization exceeds 70%.
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    # Trigger 2: scale out when Kafka consumer lag exceeds 500 messages.
    # External metric `kafka_consumergroup_lag` is published to the Kubernetes external
    # metrics API by the Prometheus Adapter (prometheus-adapter), sourced from
    # kafka-exporter / Strimzi broker metrics. averageValue means 500
    # lagging messages per replica before scaling out.
    - type: External
      external:
        metric:
          name: kafka_consumergroup_lag
          selector:
            matchLabels:
              consumergroup: llm-service
        target:
          type: AverageValue
          averageValue: "500"
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - type: Percent
          value: 100
          periodSeconds: 30
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
