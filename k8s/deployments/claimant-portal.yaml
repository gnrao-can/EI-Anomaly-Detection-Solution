---
# claimant-portal — Deployment + HorizontalPodAutoscaler
# Requirements: 17.5 (horizontal pod autoscaling; hold latency under 3x load spikes)
# Design: Deployment Topology — claimant-portal (min: 3, max: 20 pods)
# Port 3000. Health probe: GET /.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: claimant-portal
  namespace: ei-ads-prod
  labels:
    app.kubernetes.io/name: claimant-portal
    app.kubernetes.io/part-of: ei-ads
    app.kubernetes.io/component: frontend
    ei-ads/tier: portal
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: claimant-portal
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: claimant-portal
        app.kubernetes.io/part-of: ei-ads
        app.kubernetes.io/component: frontend
        ei-ads/tier: portal
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: claimant-portal
          image: registry.ei-ads.gc.ca/ei-ads/claimant-portal:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: claimant-portal
  namespace: ei-ads-prod
  labels:
    app.kubernetes.io/name: claimant-portal
    app.kubernetes.io/part-of: ei-ads
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: claimant-portal
  minReplicas: 3
  maxReplicas: 20
  metrics:
    # Trigger 1: scale out when average CPU utilization exceeds 70%.
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - type: Percent
          value: 100
          periodSeconds: 30
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
