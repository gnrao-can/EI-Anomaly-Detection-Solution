[tool.poetry]
name = "ei-anomaly-detection-solution"
version = "0.1.0"
description = "AI-Enabled Employment Insurance Anomaly Detection Solution (EI-ADS)"
authors = ["ESDC EI-ADS Team"]
packages = [
    { include = "shared" },
]

[tool.poetry.dependencies]
python = ">=3.11,<3.12"

# FastAPI stack
fastapi = "0.115.6"
uvicorn = {version = "0.32.1", extras = ["standard"]}
pydantic = "2.10.3"
pydantic-settings = "2.7.0"          # every service config.py: BaseSettings (>=2.4 for langchain-community)
httpx = "0.28.1"
asyncpg = "0.30.0"
aiokafka = "0.12.0"
redis = "5.2.1"
python-multipart = "0.0.9"           # claim-intake / portal multipart Form/File
python-jose = {version = "3.3.0", extras = ["cryptography"]}  # shared/auth.py: JWT/JWKS
numpy = "1.26.4"                     # ensemble-scorer scoring/shap; <2 for langchain-community

# Observability (task 31.1) — imported behind a guard in shared/metrics.py
structlog = "24.4.0"                 # shared logging setup across services
python-json-logger = "2.0.7"         # shared JSON log formatter
prometheus-client = "0.21.1"
prometheus-fastapi-instrumentator = "7.0.0"

# ML / AI
xgboost = "2.1.3"
shap = "0.46.0"
scikit-learn = "1.6.0"
torch = "2.5.1"
torch-geometric = "2.6.1"
transformers = "4.47.1"
langchain = "0.3.12"
langchain-community = "0.3.12"
llama-cpp-python = "0.3.4"
sentence-transformers = "3.3.1"
prophet = "1.1.6"
networkx = "3.4.2"

# Document AI
pypdf = "5.1.0"
"pdfminer.six" = "20231228"
cryptography = "44.0.0"
pillow = "11.0.0"

# Data adapters
zeep = "4.3.1"
lxml = "5.3.0"
clickhouse-connect = "0.8.12"
neo4j = "5.27.0"

[tool.poetry.group.dev.dependencies]
pytest = "8.3.4"
hypothesis = "6.115.0"
black = "24.10.0"
ruff = "0.8.4"
mypy = "1.13.0"
testcontainers = "4.9.0"
locust = "2.32.3"
schemathesis = "3.39.4"
pip-audit = "2.7.3"
safety = "3.2.11"

[build-system]
requires = ["poetry-core>=1.9.0"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I", "UP", "B", "S", "ANN"]
ignore = ["ANN101", "ANN102"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: end-to-end tests that may require external services (skipped when unavailable)",
]

[tool.hypothesis]
# Registered in conftest.py; kept here for documentation
# CI profile: max_examples=200, suppress_health_check=[too_slow]
# dev profile: max_examples=50
