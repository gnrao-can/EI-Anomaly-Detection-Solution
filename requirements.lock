# EI-ADS aggregate lock file — audited by pip-audit + safety.
#
# This is the single, canonical, fully-pinned dependency set that the
# dependency-security gate scans (task 38.1, Requirement 19.6). It is derived
# from the authoritative root manifest `pyproject.toml` plus the shared
# observability pins in scripts/dependencies/requirements-shared.txt.
#
# Policy: zero CVEs with CVSS >= 7.0. Any accepted deviation MUST be recorded in
# scripts/dependencies/EXCEPTIONS.md with a GitHub issue reference and a
# remediation date no more than 30 days out, and ignored explicitly in
# scripts/dependencies/safety-policy.yml.
#
# Scanned by:
#   pip-audit --strict --vulnerability-service osv -r requirements.lock
#   safety check --full-report --policy-file scripts/dependencies/safety-policy.yml
#
# Regenerate after editing pyproject.toml or the per-service requirements-*.txt
# manifests; keep versions in sync with scripts/dependencies/python-versions.toml.
#
# Python 3.11 ONLY: this set is pinned to the 3.11 stack (torch==2.5.1 et al.)
# and is NOT installable on Python 3.13+ (no wheels — pip aborts before anything
# installs). For local core-service development use
# scripts/dependencies/requirements-core.txt and see the
# "Local development on Python 3.11" section of scripts/dependencies/README.md.

