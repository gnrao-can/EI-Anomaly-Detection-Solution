# ============================================================
# EI-ADS Local Development — podman-compose.yml
# Install: pip install podman-compose
# Run:     podman-compose up -d
# Stop:    podman-compose down
#
# All containers run rootless via Podman.
# Credentials here are LOCAL DEVELOPMENT ONLY — never use in production.
# ============================================================

version: "3.9"

services:

  # ── Apache Kafka (via KRaft — no ZooKeeper) ───────────────
  kafka:
    # NOTE: bitnami/kafka:3.7.0 was removed from Docker Hub when Bitnami
    # relocated its catalog (2025); the tag now returns "manifest unknown".
    # bitnamilegacy/* preserves the old images and is a drop-in -- all the
    # KAFKA_CFG_* env vars, the /bitnami/kafka volume path, and the
    # kafka-topics.sh healthcheck below remain valid.
    image: docker.io/bitnamilegacy/kafka:3.7.0
    container_name: ei-ads-kafka
    # No host port — internal only (services reach it as kafka:9092). Publishing
    # only the proxy's 8080 avoids the Podman rootless/applehv multi-port
    # allocator bug (see claim-intake note / docs/regeneration/STATUS.md).
    environment:
      # KRaft mode — no ZooKeeper required
      KAFKA_CFG_NODE_ID: "1"
      KAFKA_CFG_PROCESS_ROLES: "broker,controller"
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_CFG_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093"
      # Advertise the in-network service name so containers connecting to
      # kafka:9092 are not redirected to their own localhost. (Was localhost:9092,
      # which only worked while 9092 was published to the host.)
      KAFKA_CFG_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092"
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: "PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT"
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      # Replication / durability (single-node dev values)
      KAFKA_CFG_DEFAULT_REPLICATION_FACTOR: "1"
      KAFKA_CFG_MIN_INSYNC_REPLICAS: "1"
      KAFKA_CFG_NUM_PARTITIONS: "3"
      # Log retention
      KAFKA_CFG_LOG_RETENTION_HOURS: "168"
      ALLOW_PLAINTEXT_LISTENER: "yes"
    volumes:
      - kafka-data:/bitnami/kafka
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # ── Redis (single node for local dev; cluster in production) ─
  redis:
    image: docker.io/redis:7.4.1-alpine
    container_name: ei-ads-redis
    # No host port — internal only (redis:6379). See claim-intake note.
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # ── PostgreSQL ────────────────────────────────────────────
  postgres:
    image: docker.io/postgres:16.4-alpine
    container_name: ei-ads-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ei_ads
      POSTGRES_USER: ei_ads_app
      POSTGRES_PASSWORD: changeme_local_only
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Apply the EI-ADS schema on first init. The postgres image runs files in
      # /docker-entrypoint-initdb.d in lexical order; we mount ONLY the numbered
      # .sql migrations (NOT run_migrations.sh, which needs DATABASE_URL and
      # would abort init). Numbered names apply in dependency order.
      - ./scripts/migrations/001_create_claims.sql:/docker-entrypoint-initdb.d/001_create_claims.sql:ro
      - ./scripts/migrations/002_create_risk_assessments.sql:/docker-entrypoint-initdb.d/002_create_risk_assessments.sql:ro
      - ./scripts/migrations/003_create_indicators.sql:/docker-entrypoint-initdb.d/003_create_indicators.sql:ro
      - ./scripts/migrations/004_create_audit_log.sql:/docker-entrypoint-initdb.d/004_create_audit_log.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ei_ads_app -d ei_ads"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  # ── ClickHouse ────────────────────────────────────────────
  clickhouse:
    image: docker.io/clickhouse/clickhouse-server:24.11.1-alpine
    container_name: ei-ads-clickhouse
    # No host port — internal only (clickhouse:8123/9000). See claim-intake note.
    environment:
      CLICKHOUSE_DB: ei_ads_analytics
      CLICKHOUSE_USER: ei_ads_app
      CLICKHOUSE_PASSWORD: changeme_local_only
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - clickhouse-logs:/var/log/clickhouse-server
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    ulimits:
      nofile:
        soft: 262144
        hard: 262144

  # ── Neo4j ─────────────────────────────────────────────────
  neo4j:
    image: docker.io/neo4j:5.26.0-community
    container_name: ei-ads-neo4j
    # No host port — internal only (neo4j:7474/7687). See claim-intake note.
    environment:
      NEO4J_AUTH: "neo4j/changeme_local_only"
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: "apoc.*"
      NEO4J_dbms_memory_heap_initial__size: "512m"
      NEO4J_dbms_memory_heap_max__size: "1G"
      NEO4J_dbms_memory_pagecache_size: "512m"
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # ── OpenTelemetry Collector (distributed tracing — task 32.1 / Req 21.5) ─
  # Receives OTLP spans from every EI-ADS service and exports them to the
  # configured tracing backend. Services set OTEL_EXPORTER_OTLP_ENDPOINT to
  # http://otel-collector:4317 (see shared/telemetry.py).
  otel-collector:
    image: docker.io/otel/opentelemetry-collector-contrib:0.116.1
    container_name: ei-ads-otel-collector
    command: ["--config=/etc/otel-collector-config.yaml"]
    # No host port — internal only (otel-collector:4317/4318). See claim-intake note.
    volumes:
      - ./scripts/otel/otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    # No healthcheck: the collector-contrib image is distroless (no shell,
    # no wget), so a CMD-SHELL/wget probe can never execute and would flap the
    # container to "unhealthy" despite it running correctly. The health_check
    # extension still serves readiness on :13133 (mapped to the host) for
    # external monitoring; readiness here is inferred from the running state.
    restart: unless-stopped

  # ══════════════════════════════════════════════════════════
  # EI-ADS application services — the VERIFIED SLICE only.
  #
  # This composes the slice built + verified so far (Slice 1 thin thread +
  # Slice 2 dashboard + Slice 3/3+ engines): intake -> Kafka -> ROE adapter ->
  # orchestrator -> ALL SIX engines (Repetitive Pattern, History Inconsistency,
  # Regional Analysis, Geographic Anomaly, Fraud Ring, Document Forgery) ->
  # Ensemble Scorer -> claim.scored; plus the mock-data adapters those engines
  # call (CRA, Stats Canada, Job Bank, GeoNames, MVR, CBSA, Business Registry),
  # the Graph Service backed by REAL Neo4j (the Fraud Ring graph relationship
  # seam, Req 5.1/5.5/5.10), the LLM Service (narrative-contradiction Req 6.6 +
  # style-analysis Req 7.8 + bilingual explanations Req 20; StubLLM in dev, real
  # Llama model-gated), and the portal-backend + SPA behind a single-origin
  # proxy. Document Forgery's OCR is the LayoutLMv3 plug-in point (stub in dev);
  # everything else runs real. With >=3 engines reachable the pipeline reaches a
  # DETERMINATE decision (Req 2.2) — see docs/regeneration/STATUS.md. All images
  # build from the MONOREPO ROOT.
  # ══════════════════════════════════════════════════════════

  # ── Local-dev JWKS (internal GCKey Bearer validation; Req 19.7) ─
  # Serves the JWKS generated by scripts/dev/gen-service-token.py so the engines
  # + scorer validate the orchestrator's service token against a REAL key. Run
  # `python scripts/dev/gen-service-token.py` before `up`.
  jwks:
    image: docker.io/caddy:2.8-alpine
    container_name: ei-ads-jwks
    command: ["caddy", "file-server", "--root", "/srv", "--listen", ":80"]
    volumes:
      - ./scripts/dev/jwks:/srv:ro
    restart: unless-stopped

  # ── LLM Service (Slice 3+ — narrative classification + explanations) ─
  # Wraps Llama 3.1 via LangChain (Req 20); in dev the GGUF weights are absent so
  # it runs the DETERMINISTIC StubLLM + hashing-similarity fallback (the real
  # Llama is a model-gated plug-in — mount weights + set LLM_LLAMA_MODEL_PATH to
  # enable). Serves /llm/similarity, /llm/explain, /llm/narrative-contradiction
  # (History Req 6.6) and /llm/style-analysis (Document Forgery Req 7.8). Every
  # endpoint validates a GCKey INVESTIGATOR Bearer (Req 19.7). Listens on 8005.
  llm-service:
    build:
      context: .
      dockerfile: services/llm-service/Containerfile
    container_name: ei-ads-llm-service
    # No host port — internal only (see claim-intake note).
    environment:
      LLM_SERVICE_NAME: "llm-service"
      GCKEY_JWKS_URL: "http://jwks:80/.well-known/jwks.json"
    # depends_on omitted — see claim-intake note above.
    restart: unless-stopped

  # ── Claim Intake Service ──────────────────────────────────
  claim-intake:
    build:
      context: .
      dockerfile: services/claim-intake/Containerfile
    container_name: ei-ads-claim-intake
    # No host port — internal only (claim-intake:8001). The walkthrough submits
    # a claim from inside the compose network (a throwaway curl container), which
    # avoids stuck gvproxy host-port forwards. See docs/regeneration/STATUS.md.
    environment:
      KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
      POSTGRES_HOST: "postgres"
      POSTGRES_PORT: "5432"
      POSTGRES_DB: "ei_ads"
      POSTGRES_USER: "ei_ads_app"
      POSTGRES_PASSWORD: "changeme_local_only"
      REDIS_URL: "redis://redis:6379"
      GCKEY_JWKS_URL: "http://jwks:80/.well-known/jwks.json"
      SIN_HASH_SALT: "local_dev_salt_change_me"
    # NOTE: depends_on intentionally omitted. podman-compose translates it into
    # hard --requires container links, which (a) deadlock out-of-order removal
    # and (b) couple container network namespaces, causing spurious "address
    # already in use" port-bind failures on start. Services degrade-and-retry
    # until their dependencies are reachable, so ordering is not required for a
    # local dev bring-up. (See docs/regeneration/STATUS.md "Task 30".)
    restart: unless-stopped

  # ── ROE Adapter ───────────────────────────────────────────
  roe-adapter:
    build:
      context: .
      dockerfile: services/roe-adapter/Containerfile
    container_name: ei-ads-roe-adapter
    # No host port — internal only (see claim-intake note).
    environment:
      ROE_ADAPTER_KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
      ROE_ADAPTER_KAFKA_ROE_TOPIC: "roe.received"
      # /roe/rest validates a GCKey Bearer (Req 19.7); without a JWKS URL it
      # returns 401 "Unable to retrieve GCKey signing keys". Was missing.
      GCKEY_JWKS_URL: "http://jwks:80/.well-known/jwks.json"
    # depends_on omitted — see claim-intake note above.
    restart: unless-stopped

  # ── CRA Adapter (Slice 3 — signals for History Inconsistency) ─
  # Dev mode: no mTLS material → deterministic SYNTHETIC T4 records (Req 11.8).
  # Auth-gated: every request requires a GCKey Bearer with the INVESTIGATOR role
  # (Req 19.7); the History engine forwards the caller's Bearer token.
  cra-adapter:
    build:
      context: .
      dockerfile: services/cra-adapter/Containerfile
    container_name: ei-ads-cra-adapter
    # No host port — internal only (see claim-intake note).
    environment:
      APP_ENV: "development"
      GCKEY_JWKS_URL: "http://jwks:80/.well-known/jwks.json"
    # depends_on omitted — see claim-intake note above.
    restart: unless-stopped

  # ── Stats Canada Adapter (Slice 3 — signals for Regional Analysis) ─
  # Dev mode: serves the LFS fixtures from mock-data/stats-canada (Req 10.x).
  # Listens on 8017 to match the Regional engine's STATSCAN_ADAPTER_URL and to
  # avoid the 8010 host-port used by the History engine. Auth-gated (Req 19.7).
  stats-canada-adapter:
    build:
      context: .
      dockerfile: services/stats-canada-adapter/Containerfile
    container_name: ei-ads-stats-canada-adapter
    # No host port — internal only (see claim-intake note).
    environment:
      APP_ENV: "development"
      STATSCAN_ADAPTER_PORT: "8017"
      STATSCAN_USE_MOCK: "true"
      # Fixtures are bind-mounted read-only (see volumes) rather than baked into
      # the image (.containerignore excludes mock-data/ from production images).
      STATSCAN_MOCK_DIR: "/app/mock-data/stats-canada"
      GCKEY_JWKS_URL: "http://jwks:80/.well-known/jwks.json"
    volumes:
      - ./mock-data/stats-canada:/app/mock-data/stats-canada:ro,z
    # depends_on omitted — see claim-intake note above.
    restart: unless-stopped

  # ── Job Bank Adapter (Slice 3 — signals for Regional Analysis) ─
  # Dev mode: always serves the open-data snapshot from mock-data/job-bank
  # (Req 16.4). Auth-gated: INVESTIGATOR Bearer required (Req 19.7).
  job-bank-adapter:
    build:
      context: .
      dockerfile: services/job-bank-adapter/Containerfile
    container_name: ei-ads-job-bank-adapter
    # No host port — internal only (see claim-intake note).
    environment:
      APP_ENV: "development"
      JOB_BANK_ADAPTER_PORT: "8016"
      # Snapshot is bind-mounted read-only (see volumes) rather than baked into
      # the image (.containerignore excludes mock-data/ from production images).
      JOB_BANK_SNAPSHOT_DIR: "/app/mock-data/job-bank"
      GCKEY_JWKS_URL: "http://jwks:80/.well-known/jwks.json"
    volumes:
      - ./mock-data/job-bank:/app/mock-data/job-bank:ro,z
    # depends_on omitted — see claim-intake note above.
    restart: unless-stopped

  # ── GeoNames Adapter (Slice 3+ — coordinate resolution for Geographic) ─
  # Dev mode: ALWAYS serves the local dump from mock-data/geonames (Req 14.4/14.5).
  # Listens on 8110 (its Containerfile). Auth-gated: INVESTIGATOR Bearer (Req 19.7).
  geonames-adapter:
    build:
      context: .
      dockerfile: services/geonames-adapter/Containerfile
    container_name: ei-ads-geonames-adapter
    # No host port — internal only (see claim-intake note).
    environment:
      APP_ENV: "development"
      # Local dump is bind-mounted read-only (see volumes) rather than baked
      # into the image (.containerignore excludes mock-data/ from prod images).
      GEONAMES_LOCAL_DUMP_PATH: "/app/mock-data/geonames/local-dump.json"
      GCKEY_JWKS_URL: "http://jwks:80/.well-known/jwks.json"
    volumes:
      - ./mock-data/geonames:/app/mock-data/geonames:ro,z
    # depends_on omitted — see claim-intake note above.
    restart: unless-stopped

  # ── MVR Adapter (Slice 3+ — vehicle ownership for Geographic Req 4.3) ─
  # Dev mode: deterministic synthetic records from mock-data/motor-vehicle
  # (Req 15.6). Listens on 8015. Auth-gated: INVESTIGATOR Bearer (Req 19.7).
  mvr-adapter:
    build:
      context: .
      dockerfile: services/mvr-adapter/Containerfile
    container_name: ei-ads-mvr-adapter
    # No host port — internal only (see claim-intake note).
    environment:
      APP_ENV: "development"
      MVR_MOCK_DATA_DIR: "/app/mock-data/motor-vehicle"
      GCKEY_JWKS_URL: "http://jwks:80/.well-known/jwks.json"
    volumes:
      - ./mock-data/motor-vehicle:/app/mock-data/motor-vehicle:ro,z
    # depends_on omitted — see claim-intake note above.
    restart: unless-stopped

  # ── CBSA Adapter (Slice 3+ — cross-border absence for Geographic Req 4.9) ─
  # Dev mode: deterministic synthetic crossing records from mock-data/cbsa
  # (Req 13.6). Listens on 8013. Auth-gated: INVESTIGATOR Bearer (Req 19.7).
  cbsa-adapter:
    build:
      context: .
      dockerfile: services/cbsa-adapter/Containerfile
    container_name: ei-ads-cbsa-adapter
    # No host port — internal only (see claim-intake note).
    environment:
      APP_ENV: "development"
      CBSA_MOCK_DATA_DIR: "/app/mock-data/cbsa"
      GCKEY_JWKS_URL: "http://jwks:80/.well-known/jwks.json"
    volumes:
      - ./mock-data/cbsa:/app/mock-data/cbsa:ro,z
    # depends_on omitted — see claim-intake note above.
    restart: unless-stopped

  # ── Repetitive Pattern Engine (the ONE implemented engine) ─
  repetitive-pattern-engine:
    build:
      context: .
      dockerfile: services/repetitive-pattern-engine/Containerfile
    container_name: ei-ads-repetitive-pattern-engine
    # No host port — internal only (see claim-intake note).
    environment:
      GCKEY_JWKS_URL: "http://jwks:80/.well-known/jwks.json"
    # depends_on omitted — see claim-intake note above.
    restart: unless-stopped

  # ── History Inconsistency Engine (Slice 3 — engine #2) ─────
  # Calls the CRA adapter for T4 earnings; presents its SERVICE_TOKEN
  # (INVESTIGATOR Bearer, Req 19.7) so the auth-gated adapter accepts the call.
  history-inconsistency-engine:
    build:
      context: .
      dockerfile: services/history-inconsistency-engine/Containerfile
    container_name: ei-ads-history-inconsistency-engine
    # No host port — internal only (see claim-intake note).
    # SERVICE_TOKEN (INVESTIGATOR Bearer) is supplied via .env.dev-token,
    # generated by scripts/dev/gen-service-token.py alongside the JWKS.
    env_file:
      - .env.dev-token
    environment:
      GCKEY_JWKS_URL: "http://jwks:80/.well-known/jwks.json"
      CRA_ADAPTER_URL: "http://cra-adapter:8011"
      # LLM Service for the narrative-contradiction check (Req 6.6/6.7). The
      # engine presents its SERVICE_TOKEN Bearer; a slow/absent LLM degrades to
      # NARRATIVE_ANALYSIS_TIMEOUT (never blocks the 500 ms core budget).
      LLM_SERVICE_URL: "http://llm-service:8005"
    # depends_on omitted — see claim-intake note above.
    restart: unless-stopped

  # ── Regional Analysis Engine (Slice 3 — engine #3) ─────────
  # Calls the Stats Canada + Job Bank adapters for regional labour-market
  # signals; presents its SERVICE_TOKEN (INVESTIGATOR Bearer, Req 19.7) so the
  # auth-gated adapters accept the calls.
  regional-analysis-engine:
    build:
      context: .
      dockerfile: services/regional-analysis-engine/Containerfile
    container_name: ei-ads-regional-analysis-engine
    # No host port — internal only (see claim-intake note).
    # SERVICE_TOKEN (INVESTIGATOR Bearer) is supplied via .env.dev-token,
    # generated by scripts/dev/gen-service-token.py alongside the JWKS.
    env_file:
      - .env.dev-token
    environment:
      GCKEY_JWKS_URL: "http://jwks:80/.well-known/jwks.json"
      STATSCAN_ADAPTER_URL: "http://stats-canada-adapter:8017"
      JOB_BANK_ADAPTER_URL: "http://job-bank-adapter:8016"
    # depends_on omitted — see claim-intake note above.
    restart: unless-stopped

  # ── Geographic Anomaly Engine (Slice 3+ — engine #4) ───────
  # Resolves residence + work location via GeoNames, computes the Haversine
  # distance, and (distance > 100 km) queries MVR (vehicle) + CBSA (cross-border
  # absence). Presents its SERVICE_TOKEN (INVESTIGATOR Bearer, Req 19.7) so the
  # three auth-gated adapters accept the calls. Listens on 8022.
  geographic-anomaly-engine:
    build:
      context: .
      dockerfile: services/geographic-anomaly-engine/Containerfile
    container_name: ei-ads-geographic-anomaly-engine
    # No host port — internal only (see claim-intake note).
    # SERVICE_TOKEN (INVESTIGATOR Bearer) is supplied via .env.dev-token,
    # generated by scripts/dev/gen-service-token.py alongside the JWKS.
    env_file:
      - .env.dev-token
    environment:
      GCKEY_JWKS_URL: "http://jwks:80/.well-known/jwks.json"
      # Point at each adapter's actual listening port (their Containerfiles):
      # geonames 8110, mvr 8015, cbsa 8013 — overriding the engine config
      # defaults so the service-name URLs resolve in the compose network.
      GEONAMES_ADAPTER_URL: "http://geonames-adapter:8110"
      MVR_ADAPTER_URL: "http://mvr-adapter:8015"
      CBSA_ADAPTER_URL: "http://cbsa-adapter:8013"
    # depends_on omitted — see claim-intake note above.
    restart: unless-stopped

  # ── Business Registry Adapter (Slice 3+ — shell-employer for Fraud Ring) ─
  # Dev mode: serves the federal + 13 provincial registry fixtures from
  # mock-data/business-registries + mock-data/provincial-registries (Req 12.6).
  # Listens on 8012. Auth-gated: INVESTIGATOR Bearer required (Req 19.7).
  business-registry-adapter:
    build:
      context: .
      dockerfile: services/business-registry-adapter/Containerfile
    container_name: ei-ads-business-registry-adapter
    # No host port — internal only (see claim-intake note).
    environment:
      APP_ENV: "development"
      # Fixtures are bind-mounted read-only (see volumes) rather than baked into
      # the image (.containerignore excludes mock-data/ from production images).
      BUSINESS_REGISTRIES_DIR: "/app/mock-data/business-registries"
      PROVINCIAL_REGISTRIES_DIR: "/app/mock-data/provincial-registries"
      GCKEY_JWKS_URL: "http://jwks:80/.well-known/jwks.json"
    volumes:
      - ./mock-data/business-registries:/app/mock-data/business-registries:ro,z
      - ./mock-data/provincial-registries:/app/mock-data/provincial-registries:ro,z
    # depends_on omitted — see claim-intake note above.
    restart: unless-stopped

  # ── Graph Service (Slice 3+ — the graph relationship seam, Req 5.1/5.5/5.10) ─
  # Builds the bipartite claimant-employer graph in REAL Neo4j (NEO4J_TEST_MODE
  # false + a live NEO4J_URI) and partitions the employer cohort with Louvain.
  # The Fraud Ring engine calls /graph/construct, /graph/cohort/{bn}, and
  # /graph/community-detect. Listens on 8006. Auth-gated (Req 19.7).
  graph-service:
    build:
      context: .
      dockerfile: services/graph-service/Containerfile
    container_name: ei-ads-graph-service
    # No host port — internal only (see claim-intake note).
    environment:
      GRAPH_SERVICE_ENVIRONMENT: "dev"
      # Use the LIVE Neo4j (not the in-memory fake): the graph relationship is
      # the value proposition, so we validate it against a real graph DB.
      NEO4J_TEST_MODE: "false"
      NEO4J_URI: "bolt://neo4j:7687"
      NEO4J_USER: "neo4j"
      NEO4J_PASSWORD: "changeme_local_only"
      GCKEY_JWKS_URL: "http://jwks:80/.well-known/jwks.json"
    # depends_on omitted — see claim-intake note above. The repo degrades and
    # /healthz reports 503 until Neo4j is reachable; graph calls retry.
    restart: unless-stopped

  # ── Fraud Ring Engine (Slice 3+ — engine #5) ───────────────
  # Detects shell employers (Business Registry, Req 5.2/5.3), coordinated
  # layoffs (Req 5.4), and community clusters (Req 5.5) over the 24-month graph
  # cohort read from Neo4j via the Graph Service. Presents its SERVICE_TOKEN
  # (INVESTIGATOR Bearer, Req 19.7) so the auth-gated adapter + graph-service
  # accept the calls. Listens on 8023.
  fraud-ring-engine:
    build:
      context: .
      dockerfile: services/fraud-ring-engine/Containerfile
    container_name: ei-ads-fraud-ring-engine
    # No host port — internal only (see claim-intake note).
    # SERVICE_TOKEN (INVESTIGATOR Bearer) is supplied via .env.dev-token,
    # generated by scripts/dev/gen-service-token.py alongside the JWKS.
    env_file:
      - .env.dev-token
    environment:
      APP_ENV: "development"
      GCKEY_JWKS_URL: "http://jwks:80/.well-known/jwks.json"
      BUSINESS_REGISTRY_ADAPTER_URL: "http://business-registry-adapter:8012"
      GRAPH_SERVICE_URL: "http://graph-service:8006"
    # depends_on omitted — see claim-intake note above.
    restart: unless-stopped

  # ── Document Forgery Engine (Slice 3+ — engine #6) ─────────
  # Validates ROE fields for internal consistency (Req 7.2), PDF-metadata
  # forensics (7.3), and absent/mismatched signatures (7.5/7.6), and cross-checks
  # the employee SIN against the employer's CRA payroll (7.7) via the CRA adapter.
  # OCR is the LayoutLMv3 plug-in point (USE_STUB_OCR=true here — the heavy
  # transformers/torch stack + a fine-tuned ROE checkpoint are a deployment
  # concern; the deterministic stub runs in dev). Presents its SERVICE_TOKEN
  # (INVESTIGATOR Bearer, Req 19.7) so the auth-gated CRA adapter accepts the
  # payroll call. Listens on 8015.
  document-forgery-engine:
    build:
      context: .
      dockerfile: services/document-forgery-engine/Containerfile
    container_name: ei-ads-document-forgery-engine
    # No host port — internal only (see claim-intake note).
    # SERVICE_TOKEN (INVESTIGATOR Bearer) is supplied via .env.dev-token,
    # generated by scripts/dev/gen-service-token.py alongside the JWKS.
    env_file:
      - .env.dev-token
    environment:
      APP_ENV: "development"
      # OCR: deterministic stub (no LayoutLMv3 model download in dev). The real
      # extractor is implemented behind a lazy transformers/torch import; set
      # USE_STUB_OCR=false + LAYOUTLMV3_MODEL_PATH to a fine-tuned ROE checkpoint
      # (and add the heavy stack to the image) to enable real OCR.
      USE_STUB_OCR: "true"
      GCKEY_JWKS_URL: "http://jwks:80/.well-known/jwks.json"
      CRA_ADAPTER_BASE_URL: "http://cra-adapter:8011"
      # LLM Service for the termination-narrative style check (Req 7.8/7.9). The
      # engine presents its SERVICE_TOKEN Bearer; the check is best-effort and
      # off the 700 ms critical path (skipped for < 5 prior ROEs).
      LLM_SERVICE_BASE_URL: "http://llm-service:8005"
    # depends_on omitted — see claim-intake note above.
    restart: unless-stopped

  # ── Ensemble Scorer (heuristic fallback; no heavy ML) ──────
  ensemble-scorer:
    build:
      context: .
      dockerfile: services/ensemble-scorer/Containerfile
    container_name: ei-ads-ensemble-scorer
    # No host port — internal only (see claim-intake note).
    environment:
      GCKEY_JWKS_URL: "http://jwks:80/.well-known/jwks.json"
      # Persist each RiskAssessment to Postgres risk_assessments so the
      # investigator dashboard queue can read it. Without this DSN the scorer
      # computes + publishes claim.scored but skips persistence (no-op path),
      # leaving the queue empty.
      EI_ADS_PG_DSN: "postgresql://ei_ads_app:changeme_local_only@postgres:5432/ei_ads"
    # depends_on omitted — see claim-intake note above.
    restart: unless-stopped

  # ── Detection Pipeline Orchestrator ───────────────────────
  pipeline-orchestrator:
    build:
      context: .
      dockerfile: services/pipeline-orchestrator/Containerfile
    container_name: ei-ads-pipeline-orchestrator
    # No host port — internal only (see claim-intake note).
    # ORCHESTRATOR_SERVICE_TOKEN is supplied via .env.dev-token (gitignored),
    # generated by scripts/dev/gen-service-token.py alongside the JWKS above.
    env_file:
      - .env.dev-token
    environment:
      ORCHESTRATOR_KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
      ORCHESTRATOR_REDIS_URL: "redis://redis:6379"
      # ALL SIX engines composed (Slice 3+ complete): repetitive-pattern +
      # history-inconsistency + regional-analysis + geographic-anomaly +
      # fraud-ring + document-forgery. With >=3 completing, the pipeline runs the
      # scorer -> DETERMINATE decision (Req 2.2). Geographic produces REAL HIGH
      # signals (no-vehicle > 100 km, Req 4.3); Fraud Ring produces REAL CRITICAL
      # signals from the graph relationship (shell-employer 5.2/5.3, coordinated-
      # layoff 5.4, community cluster 5.5 over real Neo4j); Document Forgery
      # produces REAL CRITICAL signals (internal consistency 7.2, SIN-not-in-
      # payroll 7.7 via the CRA adapter). OCR is the LayoutLMv3 plug-in point
      # (stub in dev). All six engines run concurrently (Req 2.1/2.3).
      ORCHESTRATOR_ENGINE_REPETITIVE_PATTERN_URL: "http://repetitive-pattern-engine:8021"
      ORCHESTRATOR_ENGINE_HISTORY_INCONSISTENCY_URL: "http://history-inconsistency-engine:8010"
      ORCHESTRATOR_ENGINE_REGIONAL_ANALYSIS_URL: "http://regional-analysis-engine:8020"
      ORCHESTRATOR_ENGINE_GEOGRAPHIC_ANOMALY_URL: "http://geographic-anomaly-engine:8022"
      ORCHESTRATOR_ENGINE_FRAUD_RING_URL: "http://fraud-ring-engine:8023"
      ORCHESTRATOR_ENGINE_DOCUMENT_FORGERY_URL: "http://document-forgery-engine:8015"
      ORCHESTRATOR_ENSEMBLE_SCORER_URL: "http://ensemble-scorer:8004"
    # depends_on omitted — see claim-intake note above. The orchestrator's Kafka
    # consumer degrades-and-retries until the broker is reachable, so start
    # order does not matter for a local dev bring-up.
    restart: unless-stopped

  # ── Portal Backend-for-Frontend ───────────────────────────
  portal-backend:
    build:
      context: .
      dockerfile: services/portal-backend/Containerfile
    container_name: ei-ads-portal-backend
    # No host port — reached via the Caddy proxy (localhost:8080). See claim-intake note.
    environment:
      POSTGRES_HOST: "postgres"
      POSTGRES_PORT: "5432"
      POSTGRES_DB: "ei_ads"
      POSTGRES_USER: "ei_ads_app"
      POSTGRES_PASSWORD: "changeme_local_only"
      KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
      CLAIM_INTAKE_URL: "http://claim-intake:8001"
      SESSION_SECRET: "local_dev_portal_session_secret_change_me"
      GCKEY_JWKS_URL: "http://jwks:80/.well-known/jwks.json"
      # GCKey OAuth endpoints: no local IdP, so the login flow is not walkable
      # in compose; the dashboard read/queue/detail/disposition flow IS.
      SIN_HASH_SALT: "local_dev_salt_change_me"
    # depends_on omitted — see claim-intake note above.
    restart: unless-stopped

  # ── Claimant Portal SPA (static build) ────────────────────
  claimant-portal:
    build:
      context: .
      dockerfile: services/claimant-portal/Containerfile
    container_name: ei-ads-claimant-portal
    # No published port; reached through the caddy proxy for single-origin.
    expose:
      - "3000"
    restart: unless-stopped

  # ── Caddy reverse proxy — single browser origin (localhost:8080) ─
  # / -> SPA; /auth,/api,/portal -> portal-backend, so the SPA's same-origin
  # cookie-bearing calls work against the built static SPA.
  proxy:
    image: docker.io/caddy:2.8-alpine
    container_name: ei-ads-proxy
    # Host 8090 -> container 8080. Host 8080 can get stuck held by a leftover
    # gvproxy forward from a prior run (gvproxy does not release the forward when
    # its container is removed out-of-band, and it cannot be killed selectively
    # without dropping VM networking). Browse the stack at http://localhost:8090.
    ports:
      - "8090:8080"
    volumes:
      - ./scripts/dev/Caddyfile:/etc/caddy/Caddyfile:ro
    # depends_on omitted — see claim-intake note above. Caddy retries upstreams,
    # so it tolerates the SPA/portal-backend coming up after it.
    restart: unless-stopped

volumes:
  kafka-data:
  redis-data:
  postgres-data:
  clickhouse-data:
  clickhouse-logs:
  neo4j-data:
  neo4j-logs:
